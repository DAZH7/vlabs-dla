<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta content="en-us" http-equiv="Content-Language" />
    <meta name="viewport" content="witdh=device-width, initial-scale=1.5">

    <title>Random numbers list</title>

    <style>
        body {
            background-image: linear-gradient(rgb(0,0,0),rgb(0,0,196) );
            background-color: rgb(196,0,196);
            margin-top: 0px;
            margin-left: 0px;
        }

        ol, li{
            color: rgb(255,255,0);
            font-family: Verdana;
            font-size: 24px;
        }

        #rndiv {
            color: rgb(255,255,255);
            font-weight: bold;
            margin: 15px 10px 10px 10px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 36px;
        }
        h5 {
            color: rgb(128, 128, 128);
            margin: 15px 10px 10px 10px;
            font-family: 'Times New Roman', Times, serif;
        }
        table, th {
            border: 1px solid black;
            margin: 0px;
            font-size: 24px;
            font-family: Verdana;
            padding: 0px;
            font-weight: bolder;
        }
        td {
            border: 1px solid black;
            margin: 0px;
            font-size: 24px;
            font-family: Verdana;
            color: rgb(255, 255, 255);
            font-weight: bolder;
            padding: 0px;
        }
        p {
            margin: 5px;
            font-size: 24px;
            color: rgb(255, 255, 0);
            font-weight: bolder;
            font-family: Verdana, Times, serif;
        }
    </style>
    <script>


        function Start() {
            var txtSize = txtArraySize.value;
            var size = parseInt(txtSize);
            Calc(size);
        }

        function Calc(size) {
            txtArraySize.value = size;

            var x = new Array(size);

            for (i = 0; i < size; i++) {
                var newval = 0;
                do {
                    newval = 1 + Math.floor(Math.random() * size);
                    var found = false;
                    for (j = 0; j < i; j++) {
                        if (newval == x[j]) {
                            found = true; break;
                        }
                    }
                } while (found);

                x[i] = newval;
            }
            AddPrf("calc!");
            var rows = [];
            for (i = 0; i < size; i++) {
                rows[i] = MkRow([MkTag("p", (i + 1)), "Question #" + x[i], " <input type=\"checkbox\" />"]);
            }
            //AddPrf(rows);

            //InsertH(MkTag("OL", rows));
            InsertH(MkTbl(rows), false);
        }
        function ClearReport() {
            var x = document.getElementById("id0");
            x.innerHTML = "";
        }
        //--------------------------------

        function MkRow(cells, markbold = false) {
            if (cells == null) return "";
            let tbl = "";
            for (let i = 0; i < cells.length; i++) {
                if (markbold) {
                    tbl = tbl + MkTag("th", cells[i]);
                }
                else tbl = tbl + MkTag("td", cells[i]);
            }

            return MkTag("tr", tbl);
        }

        //--------------------------------

        function MkTbl(trows) {
            let tbl = "";
            for (let i = 0; i < trows.length; i++) {
                tbl = tbl + trows[i];
            }

            return MkTag2("table", tbl);
        }
        //--------------------------------

        function MkTag(tag, text) {
            var ret = "<" + tag + ">" + text + "</" + tag + ">";
            return ret;
        }
        //--------------------------------
        function MkTag2(tag, text, atrbs = "") {
            let ret = "<" + tag + " " + atrbs + " >" + text + "</" + tag + ">";
            return ret;
        }

        function InsertT(text) {
            Insert(text, true);
        }
        function InsertH(text) {
            Insert(text, false);
        }
        function Insert(text, istext = false) {
            if (istext) {
                text = MkTag("p", text);
            }
            var x = document.getElementById("id0");

            x.innerHTML = text;
        }
        function AddPrf(txt) {
            AddHtml(MkTag("p", txt));
        }
        function AddHtml(html) {
            var x = document.getElementById("id0");
            x.innerHTML = x.innerHTML + html;
        }

    </script>
</head>

<body>



    <h4 id="rndiv">Random numbers list </h4>
    <h4 id="rndiv">Генератор списка случайных чисел </h4>
    <h5>v.20260924</h5>
    <hr />
    <table>
        <tr>
            <td colspan="2">
                <INPUT TYPE="text" SIZE=20 id="txtArraySize" value="25">
                <input TYPE="button" VALUE="RUN" ONCLICK="Start()">
                <input TYPE="button" VALUE="Clear" ONCLICK="ClearReport()">

            </td>
        </tr>

        <tr>
            <td>
                <input TYPE="button" VALUE="04" ONCLICK="Calc(4)"> <br />
                <input TYPE="button" VALUE="05" ONCLICK="Calc(5)"><br />
                <input TYPE="button" VALUE="06" ONCLICK="Calc(6)"><br />
                <input TYPE="button" VALUE="07" ONCLICK="Calc(7)"><br />
                <input TYPE="button" VALUE="08" ONCLICK="Calc(8)"><br />
                <input TYPE="button" VALUE="09" ONCLICK="Calc(9)"><br />
                <input TYPE="button" VALUE="10" ONCLICK="Calc(10)"><br />
                <input TYPE="button" VALUE="11" ONCLICK="Calc(11)"><br />
                <input TYPE="button" VALUE="12" ONCLICK="Calc(12)"><br />
                <input TYPE="button" VALUE="13" ONCLICK="Calc(13)"><br />
                <input TYPE="button" VALUE="14" ONCLICK="Calc(14)"><br />
                <input TYPE="button" VALUE="15" ONCLICK="Calc(15)"><br />
                <input TYPE="button" VALUE="16" ONCLICK="Calc(16)"><br />
                <input TYPE="button" VALUE="17" ONCLICK="Calc(17)"><br />
                <input TYPE="button" VALUE="18" ONCLICK="Calc(18)"><br />
                <input TYPE="button" VALUE="19" ONCLICK="Calc(19)"><br />
                <input TYPE="button" VALUE="20" ONCLICK="Calc(20)"><br />


            </td>
            <td>
                <p id="id0">Result:</p>
            </td>
        </tr>
    </table>
</body>
</html>
